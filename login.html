<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · CommunityHub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/apps/classic/src/login.css" />
</head>
<body class="login-body">
  <main class="login-page">
    <section class="login-card login-mode-signin" id="login-card" aria-labelledby="login-heading">
      <header class="login-brand">
        <div class="login-brand__mark" aria-hidden="true">
          <i class="fa-solid fa-building-columns"></i>
        </div>
        <h1 class="login-brand__title">CommunityHub</h1>
        <p class="login-brand__subtitle">Society operations portal</p>
      </header>

      <h2 class="login-heading login-heading-signin" id="login-heading">Sign in</h2>
      <h2 class="login-heading login-heading-signup">Create account</h2>
      <p class="login-lede login-lede-signin">Enter your credentials to access your society workspace.</p>
      <p class="login-lede login-lede-signup">Sign up to get started — verify your email if prompted.</p>

      <div id="auth-error" class="login-alert" role="alert">
        <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
        <span id="auth-error-text"></span>
      </div>

      <form id="auth-form" autocomplete="on">
        <div class="login-field">
          <label class="login-field__label" for="auth-email">Email</label>
          <div class="login-input-wrap">
            <i class="fa-solid fa-envelope" aria-hidden="true"></i>
            <input id="auth-email" name="email" type="email" autocomplete="username email" placeholder="you@domain.com" required />
          </div>
        </div>
        <div class="login-field">
          <label class="login-field__label" for="auth-password">Password</label>
          <div class="login-input-wrap">
            <i class="fa-solid fa-lock" aria-hidden="true"></i>
            <input id="auth-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required />
            <button type="button" class="login-eye" id="auth-toggle-password" aria-label="Show password">
              <i class="fa-solid fa-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="auth-login-btn" class="login-submit">
          <span class="login-submit-label-signin">Sign in</span>
          <span class="login-submit-label-signup">Create account</span>
        </button>
        <button type="button" id="auth-signup-btn" class="login-secondary">Create account</button>
      </form>

      <div id="auth-social-section" hidden>
        <div class="login-divider" aria-hidden="true">Or</div>
        <div id="auth-social-buttons" class="login-social" role="group" aria-label="Social sign-in"></div>
      </div>

      <p class="login-footer login-footer-signin">
        Don't have an account?
        <button type="button" id="auth-switch-signup">Create account</button>
      </p>
      <p class="login-footer login-footer-signup">
        Already have an account?
        <button type="button" id="auth-switch-signin">Sign in</button>
      </p>
    </section>
  </main>
  <script type="module" src="/apps/classic/src/loginPage.js"></script>
</body>
</html>
