<!-- Shared multi-page app shell (sidebar + topbar + main + footer). Injected by mountAppShell. -->
<div class="layout" id="app-shell-layout">
  <aside id="sidebar">
    <div class="sidebar-head">
      <button id="nav-toggle" class="rail-brand" type="button" aria-label="Toggle menu" title="Expand or collapse menu">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="sidebar-title">
        <a href="/#dashboard" class="brand-home-link" title="Go to dashboard">CommunityHub</a>
      </div>
    </div>

    <div class="sidebar-body">
      <label class="nav-drawer-label">Workspace</label>
      <select id="nav-apartment-switch" class="nav-drawer-select" aria-label="Select society"></select>

      <p class="nav-section-label">Menu</p>
      <div id="nav-modules" class="nav-modules" aria-label="Application modules"></div>
    </div>

    <div class="sidebar-foot">
      <div class="app-shell-user">
        <div id="sidebar-user-initials" class="rail-avatar">CH</div>
        <div class="sidebar-user-meta">
          <p id="sidebar-user-name" class="rail-user">—</p>
          <p id="sidebar-user-role" class="rail-role">—</p>
        </div>
      </div>
    </div>
  </aside>

  <main id="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <button id="mobile-nav-toggle" class="topbar-nav-btn" type="button" aria-label="Open menu">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div class="topbar-brand">
          <div class="topbar-identity">
            <div class="topbar-logo" aria-hidden="true">
              <i class="fa-solid fa-building-columns"></i>
            </div>
            <div class="topbar-identity-body">
              <div class="brand-lockup">
                <a href="/#dashboard" class="brand-lockup__app brand-home-link" title="Go to dashboard">CommunityHub</a>
                <span class="brand-lockup__divider" aria-hidden="true"></span>
                <div class="topbar-workspace-wrap">
                  <i class="fa-solid fa-city topbar-workspace-icon" aria-hidden="true"></i>
                  <span id="topbar-apartment-name" class="brand-lockup__entity" hidden></span>
                  <select id="header-apartment-switch" class="brand-lockup__workspace brand-lockup__workspace-select brand-lockup__workspace-select--header" aria-label="Select society">
                    <option value="">Select society…</option>
                  </select>
                </div>
              </div>
              <nav class="topbar-breadcrumb" aria-label="Current page">
                <span id="topbar-nav-module">Home</span>
                <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                <span id="topbar-nav-page">Dashboard</span>
              </nav>
            </div>
          </div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="topbar-actions">
          <button type="button" class="topbar-icon-btn topbar-ui-mode-btn" data-ui-mode-toggle aria-pressed="false" title="Switch UI version">
            <i class="fa-solid fa-bolt" aria-hidden="true"></i>
            <span data-ui-mode-label>New</span>
          </button>
          <button id="topbar-logout-btn" class="topbar-icon-btn topbar-icon-btn--logout" type="button" aria-label="Sign out" title="Sign out">
            <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
          </button>
        </div>
        <button id="topbar-user-btn" class="topbar-user" type="button" aria-label="User menu" aria-haspopup="true" aria-expanded="false">
          <div id="topbar-user-initials" class="topbar-user-avatar">—</div>
          <div class="topbar-user-meta">
            <div id="topbar-user-name" class="topbar-user-name">—</div>
            <div id="topbar-user-role" class="topbar-user-role">—</div>
          </div>
          <i class="fa-solid fa-chevron-down topbar-user-chevron" aria-hidden="true"></i>
        </button>
        <div id="topbar-user-menu" class="user-menu" style="display:none;" hidden>
          <div class="user-menu-section user-menu-section--society">
            <label class="user-menu-label" for="user-menu-apartment-switch">Society</label>
            <select id="user-menu-apartment-switch" class="user-menu-select expense-combobox" aria-label="Select society">
              <option value="">Select society…</option>
            </select>
          </div>
          <div class="user-menu-sep"></div>
          <a id="user-menu-home" class="user-menu-item" href="/"><i class="fa-solid fa-house"></i><span>Home (SPA)</span></a>
          <div class="user-menu-sep"></div>
          <button id="user-menu-logout" class="user-menu-item danger" type="button"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></button>
        </div>
      </div>
    </div>

    <div id="notification-toast" class="notification-toast" role="status" aria-live="polite" hidden></div>

    <div id="app-views" class="app-views app-shell-views">
      <div id="app-shell-page" class="content-view active" aria-live="polite">
        <p class="finance-mpa-status">Loading…</p>
      </div>
    </div>

    <footer class="app-shell-footer" id="app-shell-footer">
      <span class="app-shell-footer__brand">CommunityHub</span>
      <span class="app-shell-footer__sep" aria-hidden="true">·</span>
      <span class="app-shell-footer__meta" id="app-shell-footer-meta">Society operations</span>
    </footer>
  </main>
</div>
