<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard · CommunityHub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
    <div id="app-shell-root">
    <div id="ch-boot-splash" class="ch-boot-splash" role="status" aria-live="polite" aria-busy="true" aria-label="Loading">
      <style>
        .ch-boot-splash{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;margin:0;padding:0;background:#f4f6f9;font-family:Inter,system-ui,-apple-system,sans-serif}
        .ch-boot-splash__inner{display:flex;flex-direction:column;align-items:center;gap:.85rem}
        .ch-boot-splash__spinner{width:34px;height:34px;border-radius:50%;border:3px solid #dbe3ee;border-top-color:#2563eb;animation:ch-boot-spin .7s linear infinite}
        .ch-boot-splash__label{margin:0;font-size:.875rem;font-weight:500;color:#475569}
        @keyframes ch-boot-spin{to{transform:rotate(360deg)}}
      </style>
      <div class="ch-boot-splash__inner">
        <div class="ch-boot-splash__spinner" aria-hidden="true"></div>
        <p class="ch-boot-splash__label">Loading</p>
      </div>
    </div>
  </div>
  <script type="module" src="/apps/new/src/homeApp/main.js"></script>
</body>
</html>
